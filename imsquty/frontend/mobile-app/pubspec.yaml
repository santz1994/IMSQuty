name: imsquty_mobile
description: "IMSQuty Mobile App - Asset & Ticket Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.3.0
  http: ^1.1.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase & Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.5.0

  # Device Info
  device_info_plus: ^9.1.0

  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0

  # Forms & Validation
  form_builder_flutter: ^8.7.0
  form_builder_validators: ^10.0.0

  # Navigation
  go_router: ^10.2.0

  # Connectivity
  connectivity_plus: ^5.0.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Logging
  logger: ^2.0.1

  # JSON Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.5
  hive_generator: ^2.0.1
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
