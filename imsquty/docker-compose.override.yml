# Override file to skip problematic services like RabbitMQ
# This allows us to test core functionality without external dependencies

services:
  # Remove RabbitMQ - skip for now
  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: '0'
          memory: '0'
  # This effectively disables the service

  # Keep only essential services for now
  mysql:
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mailhog:
    ports:
      - "1025:1025"
      - "8025:8025"
