version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: imsquty-jaeger
    restart: unless-stopped
    ports:
      # Agent ports
      - "5775:5775/udp"  # accept zipkin.thrift over compact thrift protocol (deprecated)
      - "6831:6831/udp"  # accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp"  # accept jaeger.thrift over binary thrift protocol
      - "5778:5778"      # serve configs
      # Collector ports
      - "14268:14268"    # accept jaeger.thrift directly from clients
      - "14250:14250"    # accept model.proto
      # Query (UI) ports
      - "16686:16686"    # Jaeger UI
      # Health check
      - "14269:14269"    # Admin port for health checks
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    networks:
      - imsquty-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:14269/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  jaeger-data:

networks:
  imsquty-network:
    external: true
