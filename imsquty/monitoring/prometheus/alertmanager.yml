# Alertmanager Configuration
# Handles alert routing and notifications

global:
  resolve_timeout: 5m
  # Email configuration
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@imsquty.com'
  smtp_auth_username: 'alerts@imsquty.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

# Templates
templates:
  - '/etc/alertmanager/*.tmpl'

# Alert routing
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'team-email'
  
  routes:
    # Critical alerts go to multiple channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Database alerts
    - match:
        category: database
      receiver: 'database-team'
    
    # Security alerts
    - match:
        category: security
      receiver: 'security-team'
    
    # Business metrics (info only)
    - match:
        severity: info
      receiver: 'business-dashboard'
      repeat_interval: 24h

# Alert receivers
receivers:
  # Default email receiver
  - name: 'team-email'
    email_configs:
      - to: 'dev-team@imsquty.com'
        headers:
          Subject: '[IMSQuty] {{ .GroupLabels.alertname }} Alert'
        html: '{{ template "email.default.html" . }}'

  # Critical alerts (email + webhook)
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@imsquty.com,cto@imsquty.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
    webhook_configs:
      - url: 'http://api-gateway:3000/api/v1/alerts/webhook'
        send_resolved: true

  # Database team
  - name: 'database-team'
    email_configs:
      - to: 'database-team@imsquty.com'
        headers:
          Subject: '[Database] {{ .GroupLabels.alertname }}'

  # Security team
  - name: 'security-team'
    email_configs:
      - to: 'security@imsquty.com'
        headers:
          Subject: '[Security Alert] {{ .GroupLabels.alertname }}'

  # Business dashboard (webhook only)
  - name: 'business-dashboard'
    webhook_configs:
      - url: 'http://api-gateway:3000/api/v1/business-metrics/webhook'
        send_resolved: false

# Inhibition rules (suppress alerts when others are firing)
inhibit_rules:
  # Suppress warnings if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Suppress all if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['job']
