# Logstash Configuration for IMSQuty
# Processes logs from all 10 microservices

input {
  # Filebeat input (recommended for production)
  beats {
    port => 5044
    codec => json
  }

  # Direct TCP input (for development)
  tcp {
    port => 5000
    codec => json_lines
  }

  # UDP input (for syslog)
  udp {
    port => 5001
    codec => json
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Add service name from source
  if [service] {
    mutate {
      add_field => { "service_name" => "%{service}" }
    }
  }

  # Parse Laravel logs
  if [service] =~ /.*-service/ {
    grok {
      match => {
        "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] %{DATA:environment}\.%{DATA:level}: %{GREEDYDATA:log_message}"
      }
    }

    # Extract stack traces if present
    if [log_message] =~ /Stack trace:/ {
      mutate {
        add_tag => ["has_stack_trace"]
      }
    }

    # Extract SQL queries if present
    if [log_message] =~ /SQL:/ {
      grok {
        match => {
          "log_message" => "SQL: %{GREEDYDATA:sql_query}"
        }
      }
      mutate {
        add_tag => ["sql_query"]
      }
    }
  }

  # Parse Node.js logs (API Gateway)
  if [service] == "api-gateway" {
    json {
      source => "message"
      target => "parsed"
    }
    
    if [parsed][req] {
      mutate {
        add_field => {
          "http_method" => "%{[parsed][req][method]}"
          "http_url" => "%{[parsed][req][url]}"
          "http_status" => "%{[parsed][res][statusCode]}"
        }
      }
    }
  }

  # Categorize log levels
  if [level] {
    mutate {
      lowercase => ["level"]
    }

    if [level] == "error" or [level] == "critical" or [level] == "alert" or [level] == "emergency" {
      mutate {
        add_tag => ["error_log"]
      }
    } else if [level] == "warning" {
      mutate {
        add_tag => ["warning_log"]
      }
    } else if [level] == "info" {
      mutate {
        add_tag => ["info_log"]
      }
    } else if [level] == "debug" {
      mutate {
        add_tag => ["debug_log"]
      }
    }
  }

  # Extract request IDs for tracing
  if [request_id] or [trace_id] {
    mutate {
      add_field => { "correlation_id" => "%{[request_id]}%{[trace_id]}" }
    }
  }

  # GeoIP for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["@version", "host"]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "imsquty-logs-%{service}-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Output to stdout for debugging (disable in production)
  # stdout {
  #   codec => rubydebug
  # }

  # Output errors to separate index
  if "error_log" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "imsquty-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
}
